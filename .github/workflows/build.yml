name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller --onefile --noconsole --name qacklocker --add-data "assets;assets" --add-data "scream.mp3;." qacklocker_v6.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qacklocker-exe
          path: dist/qacklocker.exe
          if-no-files-found: error
