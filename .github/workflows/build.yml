name: Build LockerButton

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pygame psutil wmi pyinstaller

      - name: Verify syntax
        run: python -c "import ast; ast.parse(open('locker_button.py', encoding='utf-8').read())"

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name locker_button --add-data "assets;assets" --add-data "scream.mp3;." locker_button.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locker-button-exe
          path: dist/locker_button.exe
