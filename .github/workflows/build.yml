name: Build EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --uac-admin --add-data "assets;assets" --add-data "scream.mp3;." --name locker locker.py

      - uses: actions/upload-artifact@v4
        with:
          name: locker-exe
          path: dist/locker.exe
